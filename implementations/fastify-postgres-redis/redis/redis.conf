# Redis 8 as a pure cache for the ecommerce-store target, sized to its share of the budget.
#
# Every value here is derived (SPEC.md CACHE-001): nothing is persisted, and a restart is an
# empty cache. Reachable only on the compose bridge network; no port is published to the host.

bind 0.0.0.0
port 6379
protected-mode no

# Cache, not a store: no RDB snapshots, no AOF.
save ""
appendonly no

# maxmemory is passed on the command line by compose.yaml, derived from the container's memory
# limit (about 60% of it), leaving room for fragmentation, client buffers and the page cache of
# the server binary, which all count against the container. This value is only a fallback.
maxmemory 153mb
# LRU, the Redis documentation's recommendation for a cache whose popularity follows a power
# law, which the workload's access skew does (1% of products take half the traffic), restricted
# to keys with an expiry: the documented choice when one instance holds a cache and a few keys
# that must persist. Every cached value carries a TTL, so the LRU covers the whole cache; the
# generation hashes (the invalidation tokens, whose fields expire individually) and the hit
# counters have none, so they are never evicted (app/src/cache.js).
maxmemory-policy volatile-lru

# Free evicted and deleted values in the background thread rather than on the command path.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

tcp-keepalive 300
io-threads 1
loglevel notice
