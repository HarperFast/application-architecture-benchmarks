# Redis 8 as a pure cache for the ecommerce-store target, sized to its share of the budget.
#
# Every value here is derived (SPEC.md CACHE-001): nothing is persisted, and a restart is an
# empty cache. Reachable only on the compose bridge network; no port is published to the host.

bind 0.0.0.0
port 6379
protected-mode no

# Cache, not a store: no RDB snapshots, no AOF.
save ""
appendonly no

# Container limit is REDIS_MEMORY (default 384 MiB); leave room for fragmentation, client
# buffers and the allocator above maxmemory.
maxmemory 256mb
# The Redis documentation's recommended default for a cache whose popularity follows a power
# law, which the workload's access skew does (1% of products take half the traffic).
maxmemory-policy allkeys-lru

# Free evicted and deleted values in the background thread rather than on the command path.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

tcp-keepalive 300
io-threads 1
loglevel notice
