# The ecommerce-store application on Fastify + PostgreSQL + Redis.
#
# THE BUDGET IS SUMMED ACROSS ALL THREE SERVICES. The Harper reference runs as one container at
# 2 CPU / 2 GiB (ecommerce-store/containers/compose.yaml TARGET_CPUS / TARGET_MEMORY); this stack
# spends the same 2 CPU / 2 GiB across its three processes. Two ways to enforce it (README.md):
#
#   split   per-container CPU and memory limits that sum to the budget (the defaults below)
#   shared  BUDGET_CGROUP_PARENT names a cgroup slice limited to 2 CPU / 2 GiB that all three
#           containers run under, so CPU is one shared pool; per-container memory limits stay
#           (the comparison's run.sh creates the slice and sets each container's CPU limit to
#           the whole budget)
#
# Memory split (MiB): app 512 + postgres 1280 + redis 256 = 2048, and every process is sized from
# its container's limit explicitly, never from what it sees: on the tier-2 host a container
# cannot see its slice's limits (its cgroup namespace starts below them), and on a Podman VM it
# sees the VM. The defaults below are the recorded sizing for that split; the comparison's
# run.sh derives them from whatever split it is given:
#
#   app       NODE_HEAP_MIB 160 per Node process (primary and 2 workers; anonymous memory measured
#             about 200 MiB in total on dev, plus about 100 MiB of page cache for the Node binary
#             and modules, which counts against the container)
#   postgres  shared_buffers 25% and effective_cache_size 75% of the container, work_mem 4MB
#             (40 connections at most), maintenance_work_mem 64MB (the loader raises its own)
#   redis     maxmemory about 60% of the container, leaving room for fragmentation, client
#             buffers and the page cache of its own binary (about 40 MiB measured)
#
# The limits are *_MEMORY_LIMIT_MIB. They equal the split unless the comparison's run.sh is told
# MEMORY_SPLIT=slice on tier 2, where the slice's 2 GiB is the only limit and each container may
# use what the others leave; the processes are sized from the split either way.
#
# Earlier dev sessions ran the 640 / 1024 / 384 split with 256MB shared_buffers and 256mb
# maxmemory; each run records the split it used.
#
# Networking: one user-defined bridge, as for the reference. Only the app is published to the
# host, for conformance runs; Postgres and Redis are reachable only on the bridge.
#
# No healthchecks, deliberately: a compose healthcheck execs a probe INSIDE the container every
# interval, charged to the budget under measurement for the whole run (the reference dropped
# its own for the same reason). The app and the loader retry until Postgres and Redis answer,
# and readiness is probed from outside.
#
#   docker compose up -d --build                      # postgres, redis, app (app retries until both answer)
#   DATASET_DIR=/path/to/ecommerce-store/dataset/dev \
#     docker compose run --rm loader                  # verify + load (not measured)

name: aab-fastify-postgres-redis

# Base images, pinned by multi-arch index digest: a tag moves, and a stack rebuilt on another day
# would run another build of Postgres, Redis or Node. Tier 1 (arm64) and tier 2 (x86-64) resolve
# the same release. Recorded with every run; change them deliberately and say so.
x-base-images:
  postgres: &postgres-image docker.io/library/postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
  redis: &redis-image docker.io/library/redis:8.10.2-trixie@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
  node: &node-image docker.io/library/node:24.21.0-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20

services:
  postgres:
    image: *postgres-image
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-320MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-960MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
    # A clean shutdown checkpoints; at bench scale that can take longer than compose's default
    # 10 s, and a snapshot of an unclean shutdown would replay WAL on every restore.
    stop_grace_period: 120s
    environment:
      POSTGRES_USER: store
      POSTGRES_DB: store
      # Local test credential for a database reachable only on this compose bridge.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store-local-only}
      # C collation: ids sort and compare bytewise (as JavaScript compares them) and btree
      # comparisons skip locale rules.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
      # A named volume on a real filesystem. Never tmpfs.
      - pg-data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 128mb
    networks: [store]
    cgroup_parent: ${BUDGET_CGROUP_PARENT:-}
    deploy:
      resources:
        limits:
          cpus: "${PG_CPUS:-0.5}"
          memory: "${PG_MEMORY_LIMIT_MIB:-1280}m"

  redis:
    image: *redis-image
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "${REDIS_MAXMEMORY_MB:-153}mb"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [store]
    cgroup_parent: ${BUDGET_CGROUP_PARENT:-}
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.25}"
          memory: "${REDIS_MEMORY_LIMIT_MIB:-256}m"

  app:
    build:
      context: ./app
      args:
        NODE_IMAGE: *node-image
    image: localhost/aab-fastify-postgres-redis-app:latest
    environment:
      WORKERS: ${APP_WORKERS:-2}
      PG_POOL_MAX: ${PG_POOL_MAX:-8}
      DATABASE_URL: postgres://store:${POSTGRES_PASSWORD:-store-local-only}@postgres:5432/store
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: warn
      # Applies to the primary and to each worker: V8 would otherwise size its heap from the
      # memory it can see, which is not this container's limit.
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MIB:-160}
    ports:
      - "${APP_HOST_PORT:-39926}:3000"
    networks: [store]
    cgroup_parent: ${BUDGET_CGROUP_PARENT:-}
    depends_on: [postgres, redis]
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-1.25}"
          memory: "${APP_MEMORY_LIMIT_MIB:-512}m"

  # Seeding is not measured and runs outside the target's budget.
  loader:
    image: localhost/aab-fastify-postgres-redis-app:latest
    command: ["node", "src/load-dataset.js", "--dataset", "/dataset"]
    environment:
      DATABASE_URL: postgres://store:${POSTGRES_PASSWORD:-store-local-only}@postgres:5432/store
      REDIS_URL: redis://redis:6379
    volumes:
      # Point DATASET_DIR at an ecommerce-store dataset directory (e.g. .../ecommerce-store/dataset/dev).
      - ${DATASET_DIR:-./DATASET_DIR-not-set}:/dataset:ro
    networks: [store]
    depends_on: [postgres, redis]
    profiles: [tools]

networks:
  store:
    driver: bridge

volumes:
  pg-data:
