# PostgreSQL 18 for the ecommerce-store target, sized to its share of the 2 CPU / 2 GiB budget
# (see ../README.md for the split). Values follow the PostgreSQL manual's resource guidance and
# common OLTP practice for this memory size; every departure from a default is commented.
#
# The container's memory limit includes the kernel page cache Postgres reads through, so
# shared_buffers and effective_cache_size are sized against the CONTAINER limit, not the host.

listen_addresses = '*'
max_connections = 40                    # 2 app workers x PG_POOL_MAX (8) = 16, plus loader and admin headroom

# --- memory ------------------------------------------------------------------------------------
# shared_buffers (25% of the container), effective_cache_size (75%), work_mem and
# maintenance_work_mem are passed on the command line by compose.yaml, derived from the
# container's memory limit, because Postgres cannot see that limit on the tier-2 host.
huge_pages = try

# --- planner (SSD-backed virtual disk) --------------------------------------------------------------
random_page_cost = 1.1                  # SSD: random reads cost about the same as sequential
effective_io_concurrency = 200          # SSD
max_parallel_workers_per_gather = 0     # short OLTP queries on a fraction of a core; parallel plans only add overhead
jit = off                               # JIT compilation never pays off for sub-millisecond OLTP statements

# --- durability: defaults kept on purpose ----------------------------------------------------------
# fsync, synchronous_commit and full_page_writes stay ON. A committed write is durable before the
# write surface responds, which is what a production deployment runs and what SPEC WRITE-005
# requires. compose.yaml passes synchronous_commit from PG_SYNCHRONOUS_COMMIT: the comparison's
# fpr-async target sets it off, matching a reference that acknowledges a write before syncing it
# (HarperFast/harper#3243). Off, a commit returns before its WAL is flushed: an operating-system
# crash, or a Postgres crash within about three wal_writer_delay periods, can lose acknowledged
# commits, but never corrupts the database.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# --- observability ---------------------------------------------------------------------------------
# pg_stat_statements is near-universal in production and is how the findings verify that every
# hot statement is an index lookup (a silent sequential scan is the misconfiguration the
# measurement rules warn about).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = off
log_min_duration_statement = -1
log_checkpoints = on

# --- housekeeping ----------------------------------------------------------------------------------
autovacuum = on
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.english'
